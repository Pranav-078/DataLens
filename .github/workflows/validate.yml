name: Validate DataLens

on:
  push:
    branches:
      - chore/reorganize-project-structure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Node API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/node-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript build
        run: npm run build
      - name: Run backend tests
        run: npm test

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
