name: Validate DataLens

on:
  push:
    branches:
      - chore/reorganize-project-structure
      - fix/compact-profiler-results
      - fix/relationship-intelligence
      - release/production-readiness
  pull_request:
    branches:
      - main
      - fix/track-registration-rate-limit
      - fix/compact-profiler-results
      - release/production-readiness

permissions:
  contents: read

jobs:
  backend:
    name: Node API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/node-api/package-lock.json
      - name: Set up Python for real-profiler integration tests
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/python-engine/pyproject.toml
      - name: Install Python profiler test dependencies
        run: python -m pip install -e "../python-engine[dev]"
      - name: Install locked dependencies
        run: npm ci
      - name: Report backend dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log([v.severity,name,'range='+v.range,'direct='+v.isDirect,'fix='+JSON.stringify(v.fixAvailable),'via='+v.via.map(x=>typeof x==='string'?x:x.name).join(',')].join(' | ')); console.log('Totals:',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Fail on any backend dependency advisory
        run: npm audit --audit-level=low
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript build
        run: npm run build
      - name: Run backend tests
        run: npm test
      - name: Run backend lint checks
        run: npm run lint

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Report frontend dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log([v.severity,name,'range='+v.range,'direct='+v.isDirect,'fix='+JSON.stringify(v.fixAvailable),'via='+v.via.map(x=>typeof x==='string'?x:x.name).join(',')].join(' | ')); console.log('Totals:',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Fail on any frontend dependency advisory
        run: npm audit --audit-level=low
      - name: Build frontend
        run: npm run build


  python-profiler:
    name: Python profiler tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/python-engine/pyproject.toml
      - name: Install profiler and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit resolved third-party Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip list --format=freeze --exclude-editable > /tmp/datalens-audit-requirements.txt
          pip-audit --strict --no-deps -r /tmp/datalens-audit-requirements.txt
      - name: Run profiler tests
        run: python -m pytest -q


  production-images:
    name: Production Compose validation and image builds
    needs: [backend, frontend, python-profiler]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Check production backup script syntax
        run: bash -n scripts/backup-production.sh
      - name: Build production API, migration, profiler and frontend images
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml build api migrate profiler frontend
      - name: Smoke-test production stack, database privileges and browser origin checks
        run: |
          set -euo pipefail
          if ! docker compose --env-file .env.production.example -f docker-compose.production.yml up -d; then
            docker compose --env-file .env.production.example -f docker-compose.production.yml ps -a
            docker compose --env-file .env.production.example -f docker-compose.production.yml logs --no-color --tail 200 db migrate db-privileges profiler
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready > readiness.json; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file .env.production.example -f docker-compose.production.yml ps -a
            docker compose --env-file .env.production.example -f docker-compose.production.yml logs --tail 200
            exit 1
          fi
          cat readiness.json
          curl --fail --silent http://127.0.0.1:8080/healthz
          bad_origin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://attacker.example' http://127.0.0.1:8080/api/auth/logout)"
          test "$bad_origin_status" = "403"

          curl --silent --show-error --dump-header logout.headers --output logout.body -X POST -H 'Origin: https://datalens.example.com' http://127.0.0.1:8080/api/auth/logout
          good_origin_status="$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{code=$2} END{print code}' logout.headers)"
          test "$good_origin_status" = "200"
          grep -Eiq '^set-cookie: datalens_session=.*HttpOnly.*SameSite=Lax.*Secure' logout.headers

          protected_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/projects/00000000-0000-0000-0000-000000000001)"
          test "$protected_status" = "401"

          registration_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8080/api/auth/register)"
          test "$registration_status" = "403"

          # Enable registration only in this disposable CI database to exercise
          # signup, login, secure cookies and cross-account project isolation.
          AUTH_ALLOW_REGISTRATION=true docker compose --env-file .env.production.example -f docker-compose.production.yml up -d --no-deps --force-recreate api frontend
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready > readiness-after-auth.json; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

          user1_register_status="$(curl --silent --show-error --output user1.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"name":"Smoke User One","email":"smoke-one@example.invalid","password":"StrongPass#123"}' http://127.0.0.1:8080/api/auth/register)"
          test "$user1_register_status" = "201"
          user1_project="$(python -c 'import json; print(json.load(open("user1.json"))["user"]["projectId"])')"
          test -n "$user1_project"

          bad_login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"email":"smoke-one@example.invalid","password":"WrongPassword#123"}' http://127.0.0.1:8080/api/auth/login)"
          test "$bad_login_status" = "401"
          login_status="$(curl --silent --show-error --dump-header login1.headers --cookie-jar user1.cookies --output login1.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"email":"smoke-one@example.invalid","password":"StrongPass#123"}' http://127.0.0.1:8080/api/auth/login)"
          test "$login_status" = "200"
          grep -Eiq '^set-cookie: datalens_session=.*HttpOnly.*SameSite=Lax.*Secure' login1.headers
          owner_access_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie user1.cookies http://127.0.0.1:8080/api/projects/$user1_project)"
          test "$owner_access_status" = "200"

          user2_register_status="$(curl --silent --show-error --output user2.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"name":"Smoke User Two","email":"smoke-two@example.invalid","password":"StrongPass#456"}' http://127.0.0.1:8080/api/auth/register)"
          test "$user2_register_status" = "201"
          user2_project="$(python -c 'import json; print(json.load(open("user2.json"))["user"]["projectId"])')"
          test -n "$user2_project"
          cross_account_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie user1.cookies http://127.0.0.1:8080/api/projects/$user2_project)"
          test "$cross_account_status" = "404"

          curl --silent --show-error --dump-header logout.headers --output logout.body --cookie user1.cookies --cookie-jar user1.cookies -X POST -H 'Origin: https://datalens.example.com' http://127.0.0.1:8080/api/auth/logout
          good_origin_status="$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{code=$2} END{print code}' logout.headers)"
          test "$good_origin_status" = "200"
          grep -Eiq '^set-cookie: datalens_session=.*HttpOnly.*SameSite=Lax.*Secure' logout.headers
          logged_out_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie user1.cookies http://127.0.0.1:8080/api/projects/$user1_project)"
          test "$logged_out_status" = "401"

          db_privileges="$(docker compose --env-file .env.production.example -f docker-compose.production.yml exec -T db psql -U datalens_migrator -d datalens -Atqc "SELECT has_database_privilege('datalens_app','datalens','CONNECT') AND NOT has_database_privilege('datalens_app','datalens','CREATE') AND has_schema_privilege('datalens_app','public','USAGE') AND NOT has_schema_privilege('datalens_app','public','CREATE') AND has_table_privilege('datalens_app','users','SELECT') AND has_table_privilege('datalens_app','users','INSERT')")"
          test "$db_privileges" = "t"

          docker compose --env-file .env.production.example -f docker-compose.production.yml ps -a
