name: Validate DataLens

on:
  push:
    branches:
      - chore/reorganize-project-structure
      - fix/compact-profiler-results
      - fix/relationship-intelligence
      - release/production-readiness
  pull_request:
    branches:
      - main
      - fix/track-registration-rate-limit
      - fix/compact-profiler-results
      - release/production-readiness

permissions:
  contents: read

jobs:
  backend:
    name: Node API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/node-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/node-api/package-lock.json
      - name: Set up Python for real-profiler integration tests
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/python-engine/pyproject.toml
      - name: Install Python profiler test dependencies
        run: python -m pip install -e "../python-engine[dev]"
      - name: Install locked dependencies
        run: npm ci
      - name: Report backend dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log([v.severity,name,'range='+v.range,'direct='+v.isDirect,'fix='+JSON.stringify(v.fixAvailable),'via='+v.via.map(x=>typeof x==='string'?x:x.name).join(',')].join(' | ')); console.log('Totals:',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Fail on any backend dependency advisory
        run: npm audit --audit-level=low
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript build
        run: npm run build
      - name: Run backend tests
        run: npm test
      - name: Run backend lint checks
        run: npm run lint

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Report frontend dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log([v.severity,name,'range='+v.range,'direct='+v.isDirect,'fix='+JSON.stringify(v.fixAvailable),'via='+v.via.map(x=>typeof x==='string'?x:x.name).join(',')].join(' | ')); console.log('Totals:',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Fail on any frontend dependency advisory
        run: npm audit --audit-level=low
      - name: Build frontend
        run: npm run build


  python-profiler:
    name: Python profiler tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/python-engine/pyproject.toml
      - name: Resolve and pin Python runtime and dev dependencies
        run: |
          python -m pip install .
          python -m pip freeze --exclude-editable | grep -viE '^(datasage[-_]profiler([[:space:]]*@|==)|-e )' > requirements.lock
          python -m pip install -e ".[dev]"
          python -m pip freeze --exclude-editable | grep -viE '^(datasage[-_]profiler([[:space:]]*@|==)|-e )' > requirements-dev.lock
      - name: Audit resolved third-party Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --strict --no-deps -r requirements-dev.lock
      - name: Run profiler tests
        run: python -m pytest -q
      - name: Upload tested Python dependency locks
        uses: actions/upload-artifact@v6
        with:
          name: python-dependency-locks
          path: |
            backend/python-engine/requirements.lock
            backend/python-engine/requirements-dev.lock
          if-no-files-found: error


  python-lockfile-refresh:
    name: Commit verified Python dependency locks
    if: github.event_name == 'push'
    needs: [python-profiler]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download tested Python dependency locks
        uses: actions/download-artifact@v7
        with:
          name: python-dependency-locks
          path: backend/python-engine/
      - name: Commit lock files after successful verification
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/python-engine/requirements.lock backend/python-engine/requirements-dev.lock
          if git diff --cached --quiet; then
            echo "Python lock files already match the tested dependency resolution."
          else
            git commit -m "chore: lock audited Python dependencies"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  production-images:
    name: Production Compose validation and image builds
    needs: [backend, frontend, python-profiler, python-lockfile-refresh]
    if: ${{ always() && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.python-profiler.result == 'success' && (needs.python-lockfile-refresh.result == 'success' || needs.python-lockfile-refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Download tested Python runtime lock for container build
        uses: actions/download-artifact@v7
        with:
          name: python-dependency-locks
          path: backend/python-engine/
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Check production backup script syntax
        run: bash -n scripts/backup-production.sh
      - name: Build production API, migration, profiler and frontend images
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml build api migrate profiler frontend
      - name: Smoke-test production stack, database privileges and browser origin checks
        run: |
          set -euo pipefail
          if ! docker compose --env-file .env.production.example -f docker-compose.production.yml up -d; then
            docker compose --env-file .env.production.example -f docker-compose.production.yml ps -a
            docker compose --env-file .env.production.example -f docker-compose.production.yml logs --no-color --tail 200 db migrate db-privileges profiler
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready > readiness.json; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file .env.production.example -f docker-compose.production.yml ps -a
            docker compose --env-file .env.production.example -f docker-compose.production.yml logs --tail 200
            exit 1
          fi
          cat readiness.json
          curl --fail --silent http://127.0.0.1:8080/healthz
          bad_origin_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://attacker.example' http://127.0.0.1:8080/api/auth/logout)"
          test "$bad_origin_status" = "403"

          curl --silent --show-error --dump-header logout.headers --output logout.body -X POST -H 'Origin: https://datalens.example.com' http://127.0.0.1:8080/api/auth/logout
          good_origin_status="$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{code=$2} END{print code}' logout.headers)"
          test "$good_origin_status" = "200"
          grep -Eiq '^set-cookie: datalens_session=.*HttpOnly.*SameSite=Lax.*Secure' logout.headers

          protected_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/projects/00000000-0000-0000-0000-000000000001)"
          test "$protected_status" = "401"

          registration_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8080/api/auth/register)"
          test "$registration_status" = "403"

          # Enable registration only in this disposable CI database to exercise
          # signup, login, secure cookies and cross-account project isolation.
          AUTH_ALLOW_REGISTRATION=true docker compose --env-file .env.production.example -f docker-compose.production.yml up -d --no-deps --force-recreate api frontend
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready > readiness-after-auth.json; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

          user1_register_status="$(curl --silent --show-error --output user1.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"name":"Smoke User One","email":"smoke-one@example.invalid","password":"StrongPass#123"}' http://127.0.0.1:8080/api/auth/register)"
          test "$user1_register_status" = "201"
          user1_project="$(python -c 'import json; print(json.load(open("user1.json"))["user"]["projectId"])')"
          test -n "$user1_project"

          bad_login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"email":"smoke-one@example.invalid","password":"WrongPassword#123"}' http://127.0.0.1:8080/api/auth/login)"
          test "$bad_login_status" = "401"
          login_status="$(curl --silent --show-error --dump-header login1.headers --cookie-jar user1.cookies --output login1.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"email":"smoke-one@example.invalid","password":"StrongPass#123"}' http://127.0.0.1:8080/api/auth/login)"
          test "$login_status" = "200"
          grep -Eiq '^set-cookie: datalens_session=.*HttpOnly.*SameSite=Lax.*Secure' login1.headers
          session_token="$(awk 'BEGIN{IGNORECASE=1} /^set-cookie: datalens_session=/ {sub(/^[^:]*: datalens_session=/, ""); sub(/;.*/, ""); print; exit}' login1.headers)"
          test -n "$session_token"
          owner_access_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Cookie: datalens_session=$session_token" http://127.0.0.1:8080/api/projects/$user1_project)"
          test "$owner_access_status" = "200"

          user2_register_status="$(curl --silent --show-error --output user2.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"name":"Smoke User Two","email":"smoke-two@example.invalid","password":"StrongPass#456"}' http://127.0.0.1:8080/api/auth/register)"
          test "$user2_register_status" = "201"
          user2_project="$(python -c 'import json; print(json.load(open("user2.json"))["user"]["projectId"])')"
          test -n "$user2_project"
          cross_account_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Cookie: datalens_session=$session_token" http://127.0.0.1:8080/api/projects/$user2_project)"
          test "$cross_account_status" = "404"

          # Exercise a real Node -> Python -> PostgreSQL upload before taking
          # the paired database and uploaded-file backup.
          python - <<'PY'
          import csv
          with open("customers.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(["id", "name"])
              for index in range(25):
                  writer.writerow([f"C{index:03d}", f"Customer {index}"])
          with open("orders.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(["order_id", "customer_id", "status"])
              for index in range(40):
                  writer.writerow([f"O{index:03d}", f"C{index % 25:03d}", "delivered"])
          PY
          upload_status="$(curl --silent --show-error --output upload.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H "Cookie: datalens_session=$session_token" -F "projectId=$user1_project" -F "profileMode=fast" -F 'files=@customers.csv;type=text/csv' -F 'files=@orders.csv;type=text/csv' http://127.0.0.1:8080/api/uploads/validate)"
          test "$upload_status" = "200"
          upload_file_count="$(python -c 'import json; print(json.load(open("upload.json"))["fileCount"])')"
          upload_relationship_count="$(python -c 'import json; print(json.load(open("upload.json"))["profiling"]["relationshipCount"])')"
          uploaded_version_id="$(python -c 'import json; print(json.load(open("upload.json"))["versionId"])')"
          test "$upload_file_count" = "2"
          test "$upload_relationship_count" -gt 0
          test -n "$uploaded_version_id"

          curl --silent --show-error --dump-header logout.headers --output logout.body --cookie user1.cookies --cookie-jar user1.cookies -X POST -H 'Origin: https://datalens.example.com' http://127.0.0.1:8080/api/auth/logout
          good_origin_status="$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{code=$2} END{print code}' logout.headers)"
          test "$good_origin_status" = "200"
          grep -Eiq '^set-cookie: datalens_session=.*HttpOnly.*SameSite=Lax.*Secure' logout.headers
          logged_out_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie user1.cookies http://127.0.0.1:8080/api/projects/$user1_project)"
          test "$logged_out_status" = "401"

          db_privileges="$(docker compose --env-file .env.production.example -f docker-compose.production.yml exec -T db psql -U datalens_migrator -d datalens -Atqc "SELECT has_database_privilege('datalens_app','datalens','CONNECT') AND NOT has_database_privilege('datalens_app','datalens','CREATE') AND has_schema_privilege('datalens_app','public','USAGE') AND NOT has_schema_privilege('datalens_app','public','CREATE') AND has_table_privilege('datalens_app','users','SELECT') AND has_table_privilege('datalens_app','users','INSERT')")"
          test "$db_privileges" = "t"

          # Produce a coordinated database + file-volume backup and verify it.
          BACKUP_ROOT=/tmp/datalens-backups ENV_FILE=.env.production.example ./scripts/backup-production.sh
          backup_dir="$(find /tmp/datalens-backups -mindepth 1 -maxdepth 1 -type d -name 'datalens-*' -print -quit)"
          test -n "$backup_dir"
          test -s "$backup_dir/database.dump"
          test -s "$backup_dir/storage.tar.gz"
          (cd "$backup_dir" && sha256sum --check SHA256SUMS)

          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready > readiness-after-backup.json; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

          # Restore into a separate Compose project with separate named volumes.
          recovery_compose=(docker compose -p datalens-recovery-ci --env-file .env.production.example -f docker-compose.production.yml)
          HTTP_PORT=18080 "${recovery_compose[@]}" up -d db
          recovery_db_ready=0
          for attempt in $(seq 1 24); do
            if HTTP_PORT=18080 "${recovery_compose[@]}" exec -T db sh -ec 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
              recovery_db_ready=1
              break
            fi
            sleep 2
          done
          test "$recovery_db_ready" = "1"

          HTTP_PORT=18080 "${recovery_compose[@]}" exec -T db sh -ec 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --no-owner --no-acl --exit-on-error' < "$backup_dir/database.dump"
          docker run --rm \
            --mount type=volume,src=datalens-recovery-ci_storage_data,dst=/target \
            --mount "type=bind,src=$backup_dir,dst=/backup,readonly" \
            alpine:3.21 sh -ec 'tar -xzf /backup/storage.tar.gz -C /target'

          HTTP_PORT=18080 "${recovery_compose[@]}" run --rm db-privileges
          HTTP_PORT=18080 "${recovery_compose[@]}" up -d
          recovery_ready=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:18080/api/health/ready > recovery-readiness.json; then
              recovery_ready=1
              break
            fi
            sleep 5
          done
          test "$recovery_ready" = "1"

          recovery_counts="$(HTTP_PORT=18080 "${recovery_compose[@]}" exec -T db psql -U datalens_migrator -d datalens -Atqc "SELECT (SELECT count(*) FROM users) || ':' || (SELECT count(*) FROM projects) || ':' || (SELECT count(*) FROM dataset_versions) || ':' || (SELECT count(*) FROM dataset_tables) || ':' || (SELECT count(*) FROM inferred_relationships)")"
          IFS=: read -r recovery_users recovery_projects recovery_versions recovery_tables recovery_relationships <<< "$recovery_counts"
          test "$recovery_users" = "2"
          test "$recovery_projects" = "2"
          test "$recovery_versions" = "1"
          test "$recovery_tables" = "2"
          test "$recovery_relationships" -gt 0

          recovery_storage_files="$(docker run --rm --mount type=volume,src=datalens-recovery-ci_storage_data,dst=/target alpine:3.21 sh -ec 'find /target -type f | wc -l' | tr -d '[:space:]')"
          test "$recovery_storage_files" -ge 2

          recovery_login_status="$(curl --silent --show-error --output recovery-login.json --write-out '%{http_code}' -X POST -H 'Origin: https://datalens.example.com' -H 'Content-Type: application/json' --data '{"email":"smoke-one@example.invalid","password":"StrongPass#123"}' http://127.0.0.1:18080/api/auth/login)"
          test "$recovery_login_status" = "200"

          docker compose --env-file .env.production.example -f docker-compose.production.yml ps -a
          HTTP_PORT=18080 "${recovery_compose[@]}" ps -a
