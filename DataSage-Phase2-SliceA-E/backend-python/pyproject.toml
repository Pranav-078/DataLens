[project]
name = "datasage-profiler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
# vendor/ is intentionally excluded: it's loaded via sys.path manipulation
# in app/_vendor_path.py, not installed as a package. Without this,
# setuptools' flat-layout auto-discovery sees both app/ and vendor/ as
# top-level packages and refuses to build at all ("Multiple top-level
# packages discovered in a flat-layout").
